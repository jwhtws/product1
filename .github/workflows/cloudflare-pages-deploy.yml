name: Cloudflare Pages 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ matrix.project }} 배포
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project:
          - product1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포 전 검증
        run: npm run check
      - name: ${{ matrix.project }} 운영 프로젝트 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
      - name: mukdang.com 배포 결과 검증
        if: matrix.project == 'product1'
        run: node scripts/verify-popup-deployment.mjs --url=https://mukdang.com --attempts=8 --interval-ms=15000
