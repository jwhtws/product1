name: Cloudflare Pages 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: product1 배포
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포 전 검증
        run: npm run check
      - name: product1 운영 프로젝트 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=product1 --branch=main --commit-dirty=true
      - name: mukdang.com 배포 결과 검증
        run: node scripts/verify-popup-deployment.mjs --url=https://mukdang.com --attempts=8 --interval-ms=15000
