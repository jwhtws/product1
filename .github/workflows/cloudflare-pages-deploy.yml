name: Cloudflare Pages 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ matrix.project }} 배포
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project:
          - product1
          - product2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포 전 검증
        run: npm run check
      - name: Cloudflare 배포 인증 준비
        env:
          WRANGLER_OAUTH_CONFIG: ${{ secrets.WRANGLER_OAUTH_CONFIG }}
        run: |
          test -n "$WRANGLER_OAUTH_CONFIG" || { echo "::error::WRANGLER_OAUTH_CONFIG secret is required"; exit 1; }
          printf '%s' "$WRANGLER_OAUTH_CONFIG" | base64 --decode > "$RUNNER_TEMP/wrangler-oauth.toml"
          token="$(sed -n 's/^oauth_token[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$RUNNER_TEMP/wrangler-oauth.toml")"
          test -n "$token" || { echo "::error::oauth_token is missing"; exit 1; }
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: ${{ matrix.project }} 운영 프로젝트 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: 8d2f3113c1898979a0d13c5b2a840809
          command: pages deploy . --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
      - name: mukdang.com 배포 결과 검증
        if: matrix.project == 'product1'
        run: node scripts/verify-popup-deployment.mjs --url=https://mukdang.com --attempts=8 --interval-ms=15000
