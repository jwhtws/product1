name: 롯데 수집기 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 롯데 공식 검색 페이지 구조 확인
        run: node scripts/probe-lotte-page.mjs
