name: 푸드 팝업 갱신 감시

on:
  schedule:
    - cron: "20 23 * * *"
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: food-popup-refresh-watchdog
  cancel-in-progress: false

jobs:
  verify-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 운영 피드 날짜 확인
        id: freshness
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const seoulDate = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(new Date());
          const response = await fetch(`https://mukdang.com/data/popups-public.json?watchdog=${Date.now()}`, {
            headers: { 'cache-control': 'no-cache' }
          });
          if (!response.ok) {
            console.log('fresh=false');
            process.exit(0);
          }
          const payload = await response.json();
          const updatedDate = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(new Date(payload.updatedAt));
          console.log(`fresh=${updatedDate === seoulDate}`);
          console.log(`observed=${updatedDate}`);
          NODE
      - name: 누락된 일일 갱신 재실행
        if: steps.freshness.outputs.fresh != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run food-popup-refresh.yml --ref main -f scope=all
      - name: 감시 결과
        run: echo "운영 피드 날짜=${{ steps.freshness.outputs.observed || '확인 실패' }}, 최신=${{ steps.freshness.outputs.fresh }}" >> "$GITHUB_STEP_SUMMARY"
