name: 공공데이터 인증키 등록 알림

on:
  schedule:
    # 2026-08-03 09:00 KST (GitHub cron은 UTC 기준)
    - cron: "0 0 3 8 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 인증키 등록 알림 생성
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            if (context.eventName !== 'workflow_dispatch' &&
                (now < new Date('2026-08-03T00:00:00Z') || now >= new Date('2026-08-04T00:00:00Z'))) {
              core.info('2026년 8월 3일 예약 범위가 아니므로 알림을 생성하지 않습니다.');
              return;
            }
            const title = '공공데이터 인증키를 등록할 날입니다';
            const body = [
              '요청하신 2026년 8월 3일 알림입니다.',
              '',
              '1. 공공데이터포털에서 `행정안전부_식품_일반음식점 조회서비스`의 일반 인증키(Decoding)를 발급받으세요.',
              '2. 저장소 `Settings → Secrets and variables → Actions`에서 `DATA_GO_KR_SERVICE_KEY` 이름으로 등록하세요.',
              '3. 등록 후 `식당 데이터 정기 검증` 워크플로를 실행하면 매일 자정(KST) 자동 갱신이 시작됩니다.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'all'
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
