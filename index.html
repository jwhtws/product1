<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="전국 일반음식점 정보를 한눈에 확인하는 먹당">
<title>먹당 | 오늘의 식당</title>
<style>
:root{--ink:#171717;--muted:#737373;--line:#e8e8e8;--paper:#f7f7f5;--card:#fff;--accent:#ff6b35;--shadow:0 18px 45px rgba(0,0,0,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:0 auto;padding:0 24px}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:-.06em}.brand span{color:var(--accent)}.nav{display:flex;gap:20px;color:var(--muted);font-size:14px}.nav a{color:inherit;text-decoration:none}.hero{padding:64px 0 38px}.eyebrow{color:var(--accent);font-weight:700;font-size:14px;margin-bottom:16px}.hero h1{font-size:clamp(38px,6vw,68px);letter-spacing:-.08em;line-height:1.05;margin:0 0 18px}.hero p{color:var(--muted);font-size:17px;margin:0 0 30px}.searchbar{display:grid;grid-template-columns:180px 1fr 96px;gap:10px;max-width:760px}.searchbar input,.searchbar select{min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0}.searchbar input:focus,.searchbar select:focus{border-color:#aaa;box-shadow:0 0 0 4px rgba(0,0,0,.04)}.searchbar button,.primary{background:var(--ink);color:#fff;border-radius:14px;font-weight:700}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:42px 0 18px}.section-head h2{margin:0;font-size:26px;letter-spacing:-.06em}.section-head p{margin:0;color:var(--muted);font-size:14px}.state{color:var(--muted);padding:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.restaurant-card{appearance:none;text-align:left;background:var(--card);border:1px solid rgba(0,0,0,.04);border-radius:20px;padding:22px;min-height:220px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}.restaurant-card:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.11)}.card-kicker{color:var(--accent);font-size:12px;font-weight:800;margin-bottom:20px}.restaurant-card h3{font-size:20px;letter-spacing:-.05em;margin:0 0 12px;line-height:1.25}.card-address{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 15px}.card-meta{display:flex;gap:8px;flex-wrap:wrap;color:#555;font-size:12px}.pill{padding:6px 9px;border-radius:99px;background:#f2f2f0}.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin:28px 0}.pager button{padding:10px 16px;border-radius:10px;background:#fff;border:1px solid var(--line)}.pager button:disabled{opacity:.35;cursor:not-allowed}.source-note{margin:22px 0;color:#8a8a8a;font-size:12px}.info-section{background:#fff;border-radius:24px;padding:30px;margin:48px 0;box-shadow:var(--shadow)}.info-section h2{margin:0 0 8px;letter-spacing:-.05em}.info-section p{color:var(--muted);margin:0 0 20px}.contact-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact-form label{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:13px}.contact-form .wide{grid-column:1/-1}.contact-form input,.contact-form textarea{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.contact-form textarea{min-height:110px;resize:vertical}.contact-form .primary{justify-self:start;padding:12px 18px}.comments{background:#fff;border-radius:24px;padding:30px;margin:48px 0}.comments h2{margin:0 0 18px;letter-spacing:-.05em}.footer{padding:30px 0 50px;color:#999;font-size:13px;text-align:center}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{position:relative;max-width:560px;width:100%;max-height:90vh;overflow:auto;border-radius:24px;background:#fff;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-close{position:absolute;right:18px;top:16px;width:34px;height:34px;border-radius:50%;background:#f2f2f0;font-size:20px}.modal .card-kicker{margin-top:4px}.modal h2{font-size:30px;letter-spacing:-.07em;margin:0 35px 18px 0}.detail-row{padding:15px 0;border-top:1px solid var(--line);font-size:14px}.detail-row strong{display:block;margin-bottom:6px}.detail-row span{color:var(--muted);line-height:1.6}.map-links{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.map-links a{padding:11px 14px;border-radius:10px;background:#f2f2f0;color:var(--ink);font-size:13px;text-decoration:none;font-weight:700}
@media(max-width:800px){.nav{display:none}.hero{padding-top:38px}.searchbar{grid-template-columns:1fr 1fr}.searchbar input{grid-column:1/-1}.searchbar button{grid-column:1/-1;padding:14px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.shell{padding:0 16px}.grid{grid-template-columns:1fr}.contact-form{grid-template-columns:1fr}.contact-form .wide{grid-column:auto}.info-section,.comments{padding:22px}.section-head{display:block}.section-head p{margin-top:8px}}
</style>
</head>
<body>
<header class="shell topbar"><div class="brand">🍜 <span>먹당</span></div><nav class="nav"><a href="#restaurants">식당 찾기</a><a href="#partnership">제휴 문의</a><a href="#comments">댓글</a></nav></header>
<main class="shell">
<section class="hero"><div class="eyebrow">MEOKDANG RESTAURANT GUIDE</div><h1>오늘, 어디서<br>맛있는 걸 먹을까요?</h1><p>전국 영업 중인 식당 정보를 지역과 이름으로 찾아보세요.</p><div class="searchbar"><select id="region-select" aria-label="지역 선택"><option value="">지역 불러오는 중…</option></select><input id="search-input" type="search" placeholder="식당명, 주소, 업종 검색" autocomplete="off"><button id="search-button" type="button">검색</button></div></section>
<section id="restaurants"><div class="section-head"><div><h2>식당 둘러보기</h2><p id="result-summary">실제 공공데이터를 불러오는 중입니다.</p></div></div><div id="app-state" class="state">잠시만 기다려 주세요.</div><div id="restaurant-grid" class="grid" aria-live="polite"></div><div id="pager" class="pager"></div><p class="source-note">공공데이터포털 전국 일반음식점 표준데이터 기준 · 평점은 공식 API 연결 후 표시됩니다.</p></section>
<section id="partnership" class="info-section"><h2>제휴 문의</h2><p>맛집 등록, 광고, 협업 제안을 보내주세요.</p><form class="contact-form" action="https://formspree.io/f/mojgyppj" method="POST"><input type="hidden" name="_subject" value="먹당 제휴 문의"><label>업체명<input name="업체명" required></label><label>담당자명<input name="담당자명" required></label><label>이메일<input type="email" name="email" required></label><label>연락처<input type="tel" name="연락처"></label><label class="wide">문의 내용<textarea name="문의내용" required></textarea></label><button class="primary" type="submit">문의 보내기</button></form></section>
<section id="comments" class="comments"><h2>댓글</h2><div id="disqus_thread"></div><noscript>댓글을 보려면 JavaScript를 활성화해 주세요.</noscript></section>
</main>
<footer class="footer">© 2026 먹당</footer>
<div id="detail-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="detail-title"><article class="modal"><button id="modal-close" class="modal-close" type="button" aria-label="닫기">×</button><div id="modal-content"></div></article></div>
<script>
(async function(){
const regionSelect=document.getElementById('region-select'), input=document.getElementById('search-input'), searchButton=document.getElementById('search-button'), grid=document.getElementById('restaurant-grid'), state=document.getElementById('app-state'), summary=document.getElementById('result-summary'), pager=document.getElementById('pager'), modal=document.getElementById('detail-modal'), modalContent=document.getElementById('modal-content'), pageSize=20;let regions=[],previews={},restaurants=[],page=1,fullLoaded=false,loading=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fileUrl=f=>`data/restaurants/${f.replace(/%/g,'%25')}`;
const selectedFile=()=>regionSelect.value;
function card(r,i){return `<button class="restaurant-card" type="button" data-index="${i}"><div class="card-kicker">영업 중 · ${esc(r.category||'음식점')}</div><h3>${esc(r.name)}</h3><p class="card-address">${esc(r.address)}</p><div class="card-meta"><span class="pill">상세정보 보기</span>${r.phone?`<span class="pill">☎ ${esc(r.phone)}</span>`:''}</div></button>`}
function openDetail(r){const query=encodeURIComponent(`${r.name} ${r.address}`);modalContent.innerHTML=`<div class="card-kicker">영업 중 · ${esc(r.category||'음식점')}</div><h2 id="detail-title">${esc(r.name)}</h2><div class="detail-row"><strong>주소</strong><span>${esc(r.address)}</span></div><div class="detail-row"><strong>전화번호</strong><span>${r.phone?esc(r.phone):'등록된 전화번호가 없습니다.'}</span></div><div class="detail-row"><strong>평점</strong><span>Google·네이버 공식 API 연결 후 제공 예정입니다.</span></div><div class="map-links"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${query}">Google 지도 ↗</a><a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${query}">네이버 지도 ↗</a></div>`;modal.classList.add('open')}
function render(){const q=input.value.trim().toLowerCase(),matches=restaurants.filter(r=>!q||`${r.name} ${r.address} ${r.category}`.toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(matches.length/pageSize));page=Math.min(page,pages);const shown=matches.slice((page-1)*pageSize,page*pageSize);summary.textContent=`${matches.length.toLocaleString('ko-KR')}곳${q?' 검색됨':''}`;state.textContent=fullLoaded?'식당을 눌러 주소와 지도 정보를 확인하세요.':'지역별 추천 식당 미리보기입니다. 검색하면 전체 목록을 불러옵니다.';grid.innerHTML=shown.map((r,i)=>card(r,(page-1)*pageSize+i)).join('')||'<p class="state">검색 결과가 없습니다.</p>';pager.innerHTML=matches.length?`<button type="button" data-page="prev" ${page===1?'disabled':''}>이전</button><span>${page} / ${pages}</span><button type="button" data-page="next" ${page===pages?'disabled':''}>다음</button>`:'';grid.querySelectorAll('.restaurant-card').forEach(b=>b.addEventListener('click',()=>openDetail(matches[Number(b.dataset.index)])));pager.querySelector('[data-page="prev"]')?.addEventListener('click',()=>{page--;render()});pager.querySelector('[data-page="next"]')?.addEventListener('click',()=>{page++;render()})}
async function loadFull(){if(fullLoaded)return;if(!loading){state.textContent='전체 지역 식당 데이터를 불러오는 중입니다…';loading=fetch(fileUrl(selectedFile())).then(r=>{if(!r.ok)throw Error(`데이터 응답 ${r.status}`);return r.json()}).then(data=>{restaurants=data;fullLoaded=true;page=1;render()})}return loading}
async function search(){try{await loadFull();page=1;render()}catch(e){console.error(e);state.textContent='데이터를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.'}}
function closeModal(){modal.classList.remove('open')}
document.getElementById('modal-close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});searchButton.addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
try{const [rr,pr]=await Promise.all([fetch('data/restaurants/regions.json'),fetch('data/restaurants/previews.json')]);if(!rr.ok||!pr.ok)throw Error('데이터 목록을 불러오지 못했습니다.');const rd=await rr.json();previews=await pr.json();regions=rd.regions;regionSelect.innerHTML=regions.map(r=>`<option value="${r.file}">${esc(r.name)} (${r.count.toLocaleString('ko-KR')})</option>`).join('');const initial=regions.find(r=>r.name==='서울특별시')||regions[0];regionSelect.value=initial.file;restaurants=previews[initial.file]||[];render();regionSelect.addEventListener('change',()=>{fullLoaded=false;loading=null;page=1;restaurants=previews[selectedFile()]||[];render()})}catch(e){console.error(e);state.textContent='식당 데이터를 불러오지 못했습니다. 새로고침해 주세요.'}
})();
</script>
<script>var disqus_config=function(){this.page.url=window.location.href;this.page.identifier='meokdang-home'};(function(){var d=document,s=d.createElement('script');s.src='https://product1-5.disqus.com/embed.js';s.setAttribute('data-timestamp',+new Date());(d.head||d.body).appendChild(s)})();</script>
</body>
</html>
